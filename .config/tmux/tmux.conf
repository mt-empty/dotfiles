# Terminal & colour
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# No input delay (critical for Neovim and clean send-keys delivery)
set -sg escape-time 0

# Mouse
set -g mouse on

# Large scrollback for capture-pane
set -g history-limit 50000

# Focus events (needed for Neovim autoread)
set -g focus-events on

# 1-based indexing — predictable addressing for send-keys
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Stable names — programs cannot rename windows (keeps LLM targets reliable)
set -g automatic-rename off
set -g allow-rename off

# Vi keys in copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Pane borders show index — helps human verify LLM targets
set -g pane-border-status top
set -g pane-border-format " #{pane_index}: #{pane_title} "

# Status bar — minimal and static (no clocks; moving content pollutes capture-pane)
set -g status-position top
set -g status-right ""

# Splits — open in current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Sync toggle — manual only, never default (sends keystrokes to all panes at once)
bind S setw synchronize-panes

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"
